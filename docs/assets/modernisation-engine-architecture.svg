<text x="68" y="163" fill="#22d3ee" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">SURFACES</text>
<text x="68" y="185" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">hermes modernise CLI</text>
<text x="68" y="204" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">hermes tools: modernise_*</text>
<text x="68" y="223" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">standalone Python CLI</text>
<text x="68" y="242" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12"></text>
<text x="68" y="261" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">Same Engine service and</text>
<text x="68" y="280" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">strict argument validation</text>
