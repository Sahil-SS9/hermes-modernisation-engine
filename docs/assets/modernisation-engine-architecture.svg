<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1420" viewBox="0 0 1000 1420">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.8"/></pattern>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
<marker id="arrow-rose" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#be123c"/></marker>
</defs>
<rect width="1000" height="1420" fill="#f8fafc"/><rect width="1000" height="1420" fill="url(#grid)"/>
<text x="50" y="48" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700">Hermes Modernisation Engine</text>
<text x="50" y="78" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="16">Assess source, review the contract, gate execution, and record the evidence.</text>
<rect x="720" y="30" width="230" height="38" rx="19" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><circle cx="744" cy="49" r="6" fill="#059669"/><text x="762" y="54" fill="#065f46" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700">READ-ONLY FIRST</text>
<rect x="50" y="110" width="900" height="100" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2.5"/>
<rect x="50" y="110" width="8" height="100" rx="4" fill="#0891b2"/>
<text x="74" y="140" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700">SURFACES</text>
<text x="74" y="164" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="15">Hermes CLI: hermes modernise  ·  Hermes tools: modernise_*  ·  Standalone Python CLI</text>
<text x="74" y="186" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="15">All surfaces use the same engine and strict argument validation.</text>
<rect x="50" y="250" width="900" height="100" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.5"/>
<rect x="50" y="250" width="8" height="100" rx="4" fill="#059669"/>
<text x="74" y="280" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700">ENGINE SERVICE</text>
<text x="74" y="304" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="15">Engine.invoke(action, args)  ·  service.py action router</text>
<text x="74" y="326" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="15">assess · contract · proposal · run · compare · report</text>
<rect x="50" y="390" width="900" height="115" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<rect x="50" y="390" width="8" height="115" rx="4" fill="#2563eb"/>
<text x="74" y="420" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700">READ-ONLY ASSESSMENT</text>
<text x="74" y="444" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="15">inventory.assess  ·  identity.snapshot</text>
<text x="74" y="466" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="15">Lexical symbols and citations  ·  paged inventory and plan</text>
<text x="74" y="488" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="15">Never imports or runs repository code.</text>
<rect x="50" y="545" width="900" height="115" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
<rect x="50" y="545" width="8" height="115" rx="4" fill="#b45309"/>
<text x="74" y="575" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700">REVIEW AND CONTRACT</text>
<text x="74" y="599" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="15">contracts  ·  reviews  ·  rule_reviews  ·  proposal validation</text>
<text x="74" y="621" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="15">Owner-signed review records  ·  strict schemas and digests</text>
<text x="74" y="643" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="15">A review record is not execution permission.</text>
<rect x="50" y="700" width="900" height="120" rx="12" fill="#ffffff" stroke="#be123c" stroke-width="2.5"/>
<rect x="50" y="700" width="8" height="120" rx="4" fill="#be123c"/>
<text x="74" y="730" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700">CANDIDATE AND GATED EXECUTION</text>
<text x="74" y="754" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="15">proposals  ·  candidates  ·  executor  ·  sandbox  ·  runtime</text>
<text x="74" y="776" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="15">Disposable rootless container  ·  network disabled  ·  no credentials</text>
<text x="74" y="798" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="15">Execution requires a fresh exact one-use owner grant.</text>
<rect x="50" y="860" width="900" height="105" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
<rect x="50" y="860" width="8" height="105" rx="4" fill="#7c3aed"/>
<text x="74" y="890" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700">EVIDENCE AND REPORTING</text>
<text x="74" y="914" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="15">record  ·  evidence  ·  compare  ·  proof  ·  rule_trace  ·  mutants</text>
<text x="74" y="936" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="15">Observed outcomes, gaps and bounded verdicts  ·  JSON, text or offline HTML</text>
<rect x="50" y="1010" width="430" height="135" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="74" y="1040" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700">PRIVATE JOB STORE</text>
<text x="74" y="1065" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="14">SQLite WAL + fenced writes</text>
<text x="74" y="1085" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="14">Profile-owned data root</text>
<text x="74" y="1105" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="14">Outside source and candidate roots</text>
<rect x="520" y="1010" width="430" height="135" rx="12" fill="#ffffff" stroke="#be123c" stroke-width="2.5"/>
<text x="544" y="1040" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700">OWNER AUTHORITY</text>
<text x="544" y="1065" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="14">Trusted operator configuration</text>
<text x="544" y="1085" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="14">Public keys and one-use grants</text>
<text x="544" y="1105" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="14">External to the model and candidate</text>
<rect x="50" y="1175" width="900" height="160" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="9,5"/>
<text x="72" y="1206" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700">TRUST BOUNDARIES</text>
<text x="72" y="1232" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="14">Read-only source copy  ·  disposable rootless sandbox  ·  private job store</text>
<text x="72" y="1254" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="14">Owner-held signing keys  ·  no host home, real credentials or Docker socket</text>
<text x="72" y="1276" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="14">Execution is available only with trusted operator configuration and a fresh exact grant.</text>
<path d="M500,210 L500,250" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M500,350 L500,390" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M500,505 L500,545" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M500,660 L500,700" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M500,820 L500,860" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M50,350 L25,350 L25,1075 L50,1075" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrow)"/>
<path d="M950,1075 L975,1075 L975,760 L950,760" fill="none" stroke="#be123c" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrow-rose)"/>
<text x="50" y="1375" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="14">Solid: request/control flow. Dashed: authority or private readback. Plugin surfaces are adapters; the domain engine is host-neutral.</text>
</svg>
