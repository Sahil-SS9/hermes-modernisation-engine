<text x="50" y="58" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700">Hermes Modernisation Engine</text>
<text x="50" y="88" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="14">Source assessment, reviewed migration contracts and gated old/new evidence — not a live migration service.</text>
<rect x="1245" y="38" width="305" height="42" rx="21" fill="#0f172a" stroke="#334155"/><circle cx="1270" cy="59" r="6" fill="#34d399"/><text x="1287" y="64" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="13">READ-ONLY BY DEFAULT</text>
