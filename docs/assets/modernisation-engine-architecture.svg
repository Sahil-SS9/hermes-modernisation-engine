<text x="408" y="185" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">Engine.invoke(action, args)</text>
<text x="408" y="204" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">service.py — action router</text>
<text x="408" y="223" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">assess · contract · proposal</text>
<text x="408" y="242" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">run · compare · report</text>
<text x="408" y="261" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12"></text>
<text x="408" y="280" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">No authority from prompt text</text>
<rect x="1235" y="135" width="315" height="185" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#shadow)"/>
<rect x="1235" y="135" width="315" height="185" rx="12" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-width="1.5"/>
<text x="1253" y="163" fill="#a78bfa" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">PRIVATE JOB STORE</text>
<text x="1253" y="185" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">SQLite WAL + fenced writes</text>
<text x="1253" y="204" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">profile-owned data root</text>
<text x="1253" y="223" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">jobs · schemas · evidence</text>
<text x="1253" y="242" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">content-addressed details</text>
<text x="1253" y="261" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12"></text>
<text x="1253" y="280" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">outside source and candidate roots</text>
<rect x="50" y="370" width="390" height="175" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#shadow)"/>
<rect x="50" y="370" width="390" height="175" rx="12" fill="#60a5fa" fill-opacity="0.10" stroke="#60a5fa" stroke-width="1.5"/>
<text x="68" y="398" fill="#60a5fa" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">READ-ONLY ASSESSMENT</text>
<text x="68" y="420" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">inventory.assess</text>
<text x="68" y="439" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">identity.snapshot</text>
<text x="68" y="458" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">lexical symbols + citations</text>
<text x="68" y="477" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">paged inventory and plan</text>
<text x="68" y="496" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12"></text>
<text x="68" y="515" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">never imports or runs repository code</text>
<rect x="480" y="370" width="360" height="175" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#shadow)"/>
<rect x="480" y="370" width="360" height="175" rx="12" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-width="1.5"/>
<text x="498" y="398" fill="#fbbf24" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">REVIEW AND CONTRACT</text>
<text x="498" y="420" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">contracts · reviews · rule_reviews</text>
<text x="498" y="439" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">proposal validation</text>
<text x="498" y="458" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">owner-signed review records</text>
<text x="498" y="477" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">strict schemas and digests</text>
<text x="498" y="496" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12"></text>
<text x="498" y="515" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">review is not execution permission</text>
<rect x="880" y="370" width="340" height="175" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#shadow)"/>
<rect x="880" y="370" width="340" height="175" rx="12" fill="#fb7185" fill-opacity="0.10" stroke="#fb7185" stroke-width="1.5"/>
<text x="898" y="398" fill="#fb7185" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">CANDIDATE AND EXECUTION</text>
<text x="898" y="420" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">proposals · candidates</text>
<text x="898" y="439" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">executor · sandbox · runtime</text>
<text x="898" y="458" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">disposable rootless container</text>
<text x="898" y="477" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">network disabled; no credentials</text>
<text x="898" y="496" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12"></text>
<text x="898" y="515" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">requires exact one-use owner grant</text>
<rect x="50" y="600" width="600" height="190" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#shadow)"/>
<rect x="50" y="600" width="600" height="190" rx="12" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-width="1.5"/>
<text x="68" y="628" fill="#a78bfa" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">EVIDENCE AND REPORT</text>
<text x="68" y="650" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">record · evidence · compare</text>
<text x="68" y="669" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">proof · rule_trace · mutants</text>
<text x="68" y="688" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">observed outcomes and gaps</text>
<text x="68" y="707" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">JSON · text · offline HTML</text>
<text x="68" y="726" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12"></text>
<text x="68" y="745" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">verdicts stay bounded; missing evidence is explicit</text>
<rect x="880" y="600" width="340" height="190" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#shadow)"/>
<rect x="880" y="600" width="340" height="190" rx="12" fill="#fb7185" fill-opacity="0.10" stroke="#fb7185" stroke-width="1.5"/>
<text x="898" y="628" fill="#fb7185" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">OWNER AUTHORITY</text>
<text x="898" y="650" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">trusted operator configuration</text>
<text x="898" y="669" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">public keys + one-use grants</text>
<text x="898" y="688" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">external to model/candidate</text>
<text x="898" y="707" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12"></text>
<text x="898" y="726" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">no sign or approve endpoint</text>
<text x="898" y="745" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">inside the engine</text>
<rect x="50" y="830" width="1500" height="105" rx="12" fill="#0f172a" fill-opacity="0.72" stroke="#334155" stroke-dasharray="8,5"/>
<text x="70" y="858" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700">TRUST BOUNDARIES</text>
<text x="70" y="885" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">• read-only source copy</text>
<text x="380" y="885" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">• disposable rootless sandbox</text>
<text x="720" y="885" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">• private job store</text>
<text x="1030" y="885" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">• owner-held signing keys</text>
<text x="1320" y="885" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">• no host home or Docker socket</text>
<text x="70" y="912" fill="#64748b" font-family="DejaVu Sans, sans-serif" font-size="11">Execution is unavailable unless trusted operator configuration and a fresh exact signed grant are present. Archived grants and fixture signatures never authorise a live run.</text>
