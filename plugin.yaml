  - modernise_protocol
  - modernise_response_protocol
  - modernise_schema
  - modernise_contract
  - modernise_prepare
  - modernise_attempts
  - modernise_review_request
  - modernise_review
  - modernise_rule_review_request
  - modernise_rule_review
  - modernise_rule_reviews
  - modernise_proposal
  - modernise_build
  - modernise_run
  - modernise_resume
  - modernise_control_request
  - modernise_cancel
  - modernise_recover
  - modernise_recover_build
  - modernise_recipe
  - modernise_compare
  - modernise_report
capabilities: []
config_schema:
  operator_config:
    type: str
    default: ""
    description: Absolute path to the trusted operator configuration. Empty keeps execution gated.
